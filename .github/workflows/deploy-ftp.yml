name: Deploy over FTP (optional)

# Runs only when the owner has added FTP_HOST, FTP_USER and FTP_PASSWORD as repository secrets.
# Without them this workflow skips itself; uploading loft-prod.zip by hand is the supported path.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Check for FTP secrets
        id: gate
        run: |
          if [ -n "$FTP_HOST" ] && [ -n "$FTP_USER" ] && [ -n "$FTP_PASSWORD" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "No FTP secrets: skipping."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Build and upload
        if: steps.gate.outputs.go == 'true'
        run: |
          npm ci
          node scripts/build-prod.mjs --out loft-prod.zip
          mkdir out && cd out && unzip -q ../loft-prod.zip
          sudo apt-get install -y lftp > /dev/null
          lftp -u "$FTP_USER","$FTP_PASSWORD" "$FTP_HOST" -e "set ssl:verify-certificate yes; mirror -R --only-newer public_html public_html; mirror -R --only-newer --exclude data/ loft-app loft-app; bye"
