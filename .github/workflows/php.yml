name: PHP API

on:
  push:
    paths: ["api/**", ".github/workflows/php.yml"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, sodium, openssl, curl, mbstring, iconv
          coverage: none
      - name: Syntax check
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php api/tests/run.php

  load:
    # 12 people + 1 waiting, concurrent board ops, presence and the per-IP limit against a real PHP server.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, sodium, openssl, curl, mbstring, iconv
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load check (scripts/load-room.mjs)
        run: |
          export LOFT_DATA="$(mktemp -d)"
          php -S 127.0.0.1:8099 -t api/public api/public/index.php > "$RUNNER_TEMP/php.log" 2>&1 &
          sleep 1
          node scripts/load-room.mjs http://127.0.0.1:8099/api/v1 || { cat "$RUNNER_TEMP/php.log"; exit 1; }
