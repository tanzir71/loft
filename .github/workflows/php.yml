name: PHP API

on:
  push:
    paths: ["api/**", ".github/workflows/php.yml"]
  pull_request:
    paths: ["api/**"]
  workflow_dispatch:

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, sodium, openssl, curl, mbstring, iconv
          coverage: none
      - name: Syntax check
        run: find api -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php api/tests/run.php
